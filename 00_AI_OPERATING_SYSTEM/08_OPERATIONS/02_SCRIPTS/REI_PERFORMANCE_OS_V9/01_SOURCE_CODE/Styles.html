<style>
:root{--bg:#08101d;--panel:#101b2d;--panel2:#152238;--text:#edf4ff;--muted:#8fa1bb;--line:#24334c;--blue:#4aa3ff;--green:#38d39f;--amber:#ffbd4a;--red:#ff637d;--radius:18px;--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#17345e 0,transparent 34%),var(--bg)}.login-card{width:min(420px,100%);background:rgba(16,27,45,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.brand-mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#8b5cff);font-weight:900;font-size:18px}.login-card h1{margin:18px 0 4px}.login-card p{margin:0 0 24px;color:var(--muted)}label{display:grid;gap:8px;color:var(--muted);margin:14px 0}input{width:100%;border:1px solid var(--line);background:#091424;color:var(--text);border-radius:12px;padding:13px 14px;outline:none}input:focus{border-color:var(--blue)}.remember{display:flex;align-items:center}.remember input{width:auto}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),#7568ff);color:white;padding:13px 16px;font-weight:800;cursor:pointer}.full{width:100%}.error-text{color:var(--red);min-height:20px;margin-top:12px}.app-shell{min-height:100vh;padding-bottom:calc(82px + var(--safe-bottom))}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(8,16,29,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(36,51,76,.7)}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--blue);font-weight:900}.topbar h1{font-size:20px;margin:1px 0 0}.top-actions{display:flex;gap:10px;align-items:center}.status-dot{font-size:11px;color:var(--muted)}.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:20px}.range-strip{display:flex;gap:8px;overflow:auto;padding:12px 16px;scrollbar-width:none}.range-strip button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 15px;white-space:nowrap}.range-strip button.active{background:var(--blue);color:white;border-color:var(--blue)}main{padding:0 14px 20px}.view{display:none}.view.active{display:block}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric-grid.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{background:linear-gradient(145deg,var(--panel),#0d1727);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-height:102px}.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric .value{font-size:24px;font-weight:900;margin-top:10px}.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}.panel-head{display:flex;align-items:center;justify-content:space-between}.panel h2,.panel h3{margin:0}.panel-head span,.section-title p{color:var(--muted);font-size:12px}.section-title{padding:6px 2px 10px}.section-title h2{font-size:24px;margin:0}.section-title p{margin:4px 0 0}.platform-grid,.scenario-grid{display:grid;gap:10px}.platform-card,.scenario-card,.list-card{border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:14px}.platform-card .row,.list-card .row{display:flex;justify-content:space-between;gap:12px}.platform-card h3,.list-card h3{margin:0;font-size:15px}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.kv div{min-width:0}.kv span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.kv strong{display:block;margin-top:3px;font-size:14px;overflow:hidden;text-overflow:ellipsis}.card-list{display:grid;gap:10px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#20324f;color:#aecaef}.badge.green{background:rgba(56,211,159,.15);color:var(--green)}.badge.amber{background:rgba(255,189,74,.15);color:var(--amber)}.badge.red{background:rgba(255,99,125,.15);color:var(--red)}.link-btn{border:0;background:none;color:var(--blue);font-weight:700}.trend-chart{height:170px;display:flex;align-items:flex-end;gap:4px;padding-top:18px;overflow:hidden}.trend-col{flex:1;min-width:4px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}.trend-bar{border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,var(--blue),#625cff);min-height:2px}.trend-lead{height:3px;background:var(--green);border-radius:999px}.funnel{display:grid;gap:8px}.funnel-step{border:1px solid var(--line);background:linear-gradient(90deg,rgba(74,163,255,.2),var(--panel));border-radius:14px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}.funnel-step strong{font-size:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.form-grid label{margin:0}.form-grid label span{font-size:10px;text-transform:uppercase}.scenario-card h3{margin:0 0 10px}.scenario-card .big{font-size:26px;font-weight:900}.scenario-card .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.scenario-card .stats div{background:#0c1727;border-radius:10px;padding:9px}.scenario-card .stats span{display:block;font-size:10px;color:var(--muted)}.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:rgba(10,18,31,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe-bottom))}.bottom-nav button{flex:1;min-width:62px;border:0;background:none;color:var(--muted);display:grid;gap:2px;justify-items:center;font-size:9px;padding:5px 4px}.bottom-nav button span{font-size:19px}.bottom-nav button.active{color:var(--blue)}.toast{position:fixed;z-index:50;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);background:#edf4ff;color:#0b1220;border-radius:12px;padding:10px 14px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.loading{position:fixed;inset:0;z-index:60;background:rgba(8,16,29,.72);display:grid;place-items:center;align-content:center;gap:12px}.spinner{width:38px;height:38px;border:4px solid #263956;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════ v9.1 decision layer ═══════════ */
.action-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.action-strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.green{border-color:rgba(56,211,159,.45);color:var(--green);background:rgba(56,211,159,.1)}
.chip.red{border-color:rgba(255,99,125,.45);color:var(--red);background:rgba(255,99,125,.1)}
.chip.amber{border-color:rgba(255,189,74,.45);color:var(--amber);background:rgba(255,189,74,.1)}
.chip.quiet{color:var(--muted);cursor:default;font-weight:600}
.quiet-note{color:var(--muted);font-size:12px;padding:12px 2px}

.leak-card{border:1px solid rgba(255,99,125,.4);background:linear-gradient(135deg,rgba(255,99,125,.16),var(--panel));border-radius:var(--radius);padding:15px;margin-bottom:12px;cursor:pointer}
.leak-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:900}
.leak-step{font-size:18px;font-weight:800;margin-top:5px}
.leak-stat{margin-top:6px;color:var(--muted);font-size:13px}
.leak-stat strong{color:var(--text);font-size:17px}

.chart-legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted)}
.chart-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chart-legend .dot.blue{background:var(--blue)}.chart-legend .dot.green{background:var(--green)}

/* Stage flow — the funnel with conversion % between every step */
.stage-flow{margin-top:6px}
.stage-block{margin-bottom:2px}
.stage-bar{background:linear-gradient(90deg,rgba(74,163,255,.32),rgba(74,163,255,.08));border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;min-width:170px;transition:width .3s}
.stage-bar.final{background:linear-gradient(90deg,rgba(56,211,159,.32),rgba(56,211,159,.08));border-color:rgba(56,211,159,.4)}
.stage-name{font-weight:700;font-size:13px}
.stage-count{font-size:20px;font-weight:900;margin-left:14px}
.stage-link{display:flex;align-items:center;gap:9px;padding:7px 0 7px 16px;flex-wrap:wrap}
.stage-arrow{color:var(--muted)}
.stage-rate{font-size:16px;font-weight:900}
.stage-rate.good{color:var(--green)}.stage-rate.ok{color:var(--amber)}.stage-rate.bad{color:var(--red)}.stage-rate.quiet{color:var(--muted)}
.stage-drop{font-size:11px;color:var(--muted)}
.stage-note{font-size:10px;color:var(--muted);font-style:italic}
.leak-tag{font-size:9px;font-weight:900;letter-spacing:.1em;background:var(--red);color:#fff;border-radius:999px;padding:3px 8px}
.stage-block.is-leak .stage-bar{border-color:rgba(255,99,125,.5)}

.mini-table{margin-top:4px;font-size:12px}
.mt-head,.mt-row{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(4,minmax(0,1fr));gap:8px;padding:9px 6px;align-items:center}
.mt-head{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line)}
.mt-row{border-bottom:1px solid rgba(36,51,76,.5)}
.mt-row:last-child{border-bottom:0}
.mt-row.is-leak{background:rgba(255,99,125,.08);border-radius:8px}
.mt-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Ads */
.filter-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:12px;white-space:nowrap;cursor:pointer}
.filter-chips button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.sort-row{display:flex;gap:6px;align-items:center;padding-bottom:10px;flex-wrap:wrap}
.sort-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sort-row button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:11px;cursor:pointer}
.sort-row button.active{color:var(--text);border-color:var(--blue)}

.ad-card{display:flex;gap:12px;border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:12px}
.ad-card.red{border-left:3px solid var(--red)}
.ad-card.green{border-left:3px solid var(--green)}
.ad-card.amber{border-left:3px solid var(--amber)}
.ad-thumb{width:78px;height:78px;border-radius:11px;object-fit:cover;flex:0 0 auto;cursor:pointer;background:#0c1727}
.ad-thumb.empty{display:grid;place-items:center;color:var(--muted);font-size:24px;cursor:default}
.ad-body{min-width:0;flex:1}
.ad-body h3{margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-reason{font-size:11px;color:var(--muted);margin-top:5px}
.ad-meta{font-size:10px;color:var(--muted);margin-top:9px;overflow:hidden;text-overflow:ellipsis}
.ad-meta a{color:var(--blue);text-decoration:none}
.kv.five{grid-template-columns:repeat(5,1fr);margin-top:10px}

.count-pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin-left:6px;vertical-align:middle}
.list-card.stale{border-color:rgba(255,189,74,.4)}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(4,9,17,.9);display:grid;place-items:center;padding:20px}
.lightbox-inner{width:min(640px,100%);position:relative}
.lightbox-close{position:absolute;top:-42px;right:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.lightbox-inner h3{margin:12px 0 0;font-size:15px}


/* ═══════════ v9.2 segmentation ═══════════ */
.range-select{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:13px}
/* Date pickers were being clipped: the parent had no explicit width and the native
   date input has a wide intrinsic size, so it overflowed the viewport on the left. */
.custom-range{display:flex;gap:10px;align-items:flex-end;padding:10px 16px 14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 14px 10px}
.custom-range label{margin:0;gap:4px;flex:1 1 150px;min-width:0}
.custom-range label span{font-size:10px;text-transform:uppercase;letter-spacing:.07em}
.custom-range input{padding:9px 11px;width:100%;min-width:0;color-scheme:dark}
.custom-range .primary{padding:10px 20px;flex:0 0 auto}
@media(min-width:800px){.custom-range{margin-left:204px}}

.segment-grid{display:grid;gap:12px;grid-template-columns:1fr}
.segment-card{border:1px solid var(--line);background:linear-gradient(150deg,var(--panel2),#0d1727);border-radius:16px;padding:15px}
.segment-card.good{border-color:rgba(56,211,159,.4)}
.segment-card.bad{border-color:rgba(255,99,125,.45)}
.segment-card h3{margin:0;font-size:16px}
.seg-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:13px 0 4px}
.seg-hero span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.seg-hero strong{display:block;font-size:21px;font-weight:900;margin-top:3px}
.seg-hero strong.good{color:var(--green)}.seg-hero strong.bad{color:var(--red)}

.verdict-card{margin-top:12px;border-left:3px solid var(--blue);background:rgba(74,163,255,.09);border-radius:0 12px 12px 0;padding:12px 14px;font-size:13px;line-height:1.55}
.verdict-note{margin-top:7px;font-size:11px;color:var(--muted)}

/* CPL scatter/line chart */
.line-chart{position:relative;height:190px;display:flex;align-items:flex-end;gap:3px;padding:14px 0 6px;overflow:hidden}
.lc-col{flex:1;min-width:3px;height:100%;position:relative}
.lc-stack{position:absolute;inset:0}
.lc-dot{position:absolute;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%}
.lc-dot.blue{background:var(--blue);box-shadow:0 0 8px rgba(74,163,255,.6)}
.lc-dot.amber{background:var(--amber);box-shadow:0 0 8px rgba(255,189,74,.6)}
.lc-target{position:absolute;left:0;right:0;border-top:1px dashed rgba(56,211,159,.65)}
.lc-target span{position:absolute;right:0;top:-16px;font-size:10px;color:var(--green)}
.chart-legend .dot.amber{background:var(--amber)}
.chart-legend .dot.line-target{background:none;border-top:2px dashed var(--green);border-radius:0;height:0;width:12px}
.trend-bar.amber{background:linear-gradient(180deg,var(--amber),#ff9f4a)}

/* Month-over-month */
.mt-row .up{color:var(--green);font-size:10px;font-weight:800;margin-left:4px}
.mt-row .down{color:var(--red);font-size:10px;font-weight:800;margin-left:4px}
.badge-group{display:inline-flex;gap:6px;align-items:center;flex-shrink:0}
.badge.plat{background:#1c2c46;color:#9fc0e8}

.rule-board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.rule-cell{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px;text-align:left;color:var(--text);cursor:pointer}
.rule-cell.hot{border-color:rgba(255,99,125,.5);background:rgba(255,99,125,.09)}
.rule-count{font-size:26px;font-weight:900;line-height:1}
.rule-cell.hot .rule-count{color:var(--red)}
.rule-name{font-size:12px;font-weight:700;margin-top:5px}
.rule-sub{font-size:10px;color:var(--muted);margin-top:2px}
.rule-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rule-tag{font-size:9px;font-weight:900;letter-spacing:.06em;background:rgba(255,99,125,.16);color:var(--red);border-radius:5px;padding:3px 6px;cursor:help}
.trend-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:10px}
.trend-row .good{color:var(--green)}.trend-row .bad{color:var(--red)}.trend-row .warn{color:var(--amber)}
.trend-none{color:var(--muted);font-style:italic}
.new-tag{background:rgba(74,163,255,.16);color:var(--blue);border-radius:5px;padding:2px 6px;font-weight:800}
.kv strong.bad{color:var(--red)}
@media(min-width:700px){.rule-board{grid-template-columns:repeat(4,1fr)}}
.ad-group{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;background:rgba(16,27,45,.5)}
.ad-group-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 4px 12px;flex-wrap:wrap}
.ad-group-head strong{font-size:14px}
.ad-group-stats{font-size:11px;color:var(--muted)}
.ad-group .ad-card{margin-bottom:8px}
.ad-card.paused{opacity:.62}
.ad-card.paused .ad-thumb{filter:grayscale(.7)}
.inline-check{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:11px;color:var(--muted)}
.inline-check input{width:auto}
.count-note{font-size:11px;color:var(--muted);margin-left:auto}
.mt-head,.mt-row{grid-template-columns:minmax(0,1.7fr) repeat(6,minmax(0,1fr))}
@media(min-width:700px){.segment-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}

@media(max-width:520px){
  .seg-hero strong{font-size:18px}
  .kv.five{grid-template-columns:repeat(3,1fr)}
  .mt-head,.mt-row{grid-template-columns:minmax(0,1.8fr) repeat(4,minmax(0,.7fr));font-size:11px}
  .ad-thumb{width:60px;height:60px}
}

@media(min-width:800px){.app-shell{padding-bottom:30px}.card-list.wide{grid-template-columns:1fr}.topbar{padding-left:210px}.range-strip{padding-left:210px}.bottom-nav{position:fixed;top:0;left:0;bottom:0;right:auto;width:190px;display:flex;flex-direction:column;justify-content:flex-start;padding:90px 12px 20px;border-right:1px solid var(--line);border-top:0}.bottom-nav button{flex:0;min-height:54px;display:flex;gap:12px;align-items:center;justify-content:flex-start;font-size:13px;padding:10px 12px;border-radius:12px}.bottom-nav button.active{background:var(--panel2)}main{margin-left:190px;padding:0 24px 30px}.metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.metric-grid.compact{grid-template-columns:repeat(5,minmax(0,1fr))}.platform-grid,.scenario-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card-list{grid-template-columns:repeat(2,minmax(0,1fr))}.trend-chart{height:220px}}
</style>
