<style>
:root{--bg:#08101d;--panel:#101b2d;--panel2:#152238;--text:#edf4ff;--muted:#8fa1bb;--line:#24334c;--blue:#4aa3ff;--green:#38d39f;--amber:#ffbd4a;--red:#ff637d;--radius:18px;--safe-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#17345e 0,transparent 34%),var(--bg)}.login-card{width:min(420px,100%);background:rgba(16,27,45,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.brand-mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#8b5cff);font-weight:900;font-size:18px}.login-card h1{margin:18px 0 4px}.login-card p{margin:0 0 24px;color:var(--muted)}label{display:grid;gap:8px;color:var(--muted);margin:14px 0}input{width:100%;border:1px solid var(--line);background:#091424;color:var(--text);border-radius:12px;padding:13px 14px;outline:none}input:focus{border-color:var(--blue)}.remember{display:flex;align-items:center}.remember input{width:auto}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),#7568ff);color:white;padding:13px 16px;font-weight:800;cursor:pointer}.full{width:100%}.error-text{color:var(--red);min-height:20px;margin-top:12px}.app-shell{min-height:100vh;padding-bottom:calc(82px + var(--safe-bottom))}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(8,16,29,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(36,51,76,.7)}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--blue);font-weight:900}.topbar h1{font-size:20px;margin:1px 0 0}.top-actions{display: </style>
