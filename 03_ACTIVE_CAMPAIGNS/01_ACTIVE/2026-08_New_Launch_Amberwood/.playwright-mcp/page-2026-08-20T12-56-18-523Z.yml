              - /url: mailto:?subject=Check%20out%3A%20Bukit%20Timah%20Turf%20City%20%E2%80%93%20A%20New%20Housing%20Chapter%20for%20the%20Central%20Region%20&body=I%20thought%20you%20might%20be%20interested%20in%20this%20article%3A%20Bukit%20Timah%20Turf%20City%20%E2%80%93%20A%20New%20Housing%20Chapter%20for%20the%20Central%20Region%20%0A%0Ahttps%3A%2F%2Fwww.era.com.sg%2Fblogs%2Fbukit-timah-turf-city-a-new-housing-chapter-for-the-central-region
        - img "Bukit Timah Turf City – A New Housing Chapter for the Central Region" [ref=e76]
        - generic [ref=e77]:
          - paragraph [ref=e78]: Bukit Timah is traditionally known to be a prime residential area located within the Core Central Region (CCR), with a housing landscape consisting predominantly luxury private condominiums and landed homes. However, this is set to gradually change over the next 20 to 30 years.
          - paragraph [ref=e79]: First announced by the Urban Redevelopment Authority (URA) and Housing & Development Board (HDB) in May 2024, Bukit Timah Turf City will be redeveloped into a new residential estate that is expected to yield 15,000 to 20,000 public and private homes.
          - 'figure "Source: URA" [ref=e80]'
          - paragraph [ref=e83]: "Today, this transformation has started to move from planning to implementation, with two Government Land Sales (GLS) sites tendered at Dunearn Road, bringing more private homes into the pipeline. This raises a key question: what does Turf City’s redevelopment mean for those looking to live in Bukit Timah?"
          - paragraph [ref=e84]: Here is what you need to know about this upcoming estate.
          - heading "From Horse Racing to Homes" [level=2] [ref=e85]
          - paragraph [ref=e86]: Spanning 176 hectares, Bukit Timah Turf City was once home to Singapore’s prestigious turf club from 1933 to 1999.
          - paragraph [ref=e87]: Upon the Singapore Turf Club’s relocation to Kranji in 1999, the site has been largely zoned for residential use since 1998. It continued to be leased out for lifestyle and recreational uses until the end of 2023. This included The Grandstand, which was a shopping complex that served the immediate residents and visitors in the area. The area also hosted recreational offerings such as a go-karting arena, mountain biking courses and The Premier Pitch for soccer matches.
          - heading "What Makes Bukit Timah Turf City Attractive?" [level=2] [ref=e88]
          - paragraph [ref=e89]
          - paragraph [ref=e91]: More often than not, Bukit Timah’s appeal has been tied to its greenery. Located near the Central Catchment Nature Reserve, the area boasts a lush environment, which has shaped its lower-density planning over the years. With green spaces such as the Rail Corridor, Bukit Timah Nature Reserve and Singapore Botanic Gardens just a few MRT stops away, the area offers future residents a more tranquil lifestyle while still being close to the central region.
          - 'figure "Source: NParks" [ref=e92]'
          - paragraph [ref=e95]: There are plans to form a new nature park of up to 40 hectares in Turf City. It will connect both Eng Neo Avenue Forest and Bukit Tinggi through a 100m-wide green corridor to enable wildlife movement. More nature trails and boardwalks will be introduced, bringing nature closer to future homes.
          - 'figure "Source: URA" [ref=e96]'
          - paragraph [ref=e99]: Bukit Timah Turf City’s future residential enclaves will also retain links to its racecourse history. A total of 22 buildings that represent the former Turf Club’s distinct character are slated for conservation within Bukit Timah Turf City, including the iconic grandstand that once hosted Singapore’s horse racing culture.
          - paragraph [ref=e100]: "At the same time, the Turf City will have four distinct neighbourhoods with names that reflect the site’s heritage: Racecourse Neighbourhood, Stables Commune, Saddle Club Knolls and Tinggi Hills. This will help preserve Turf’City’s history while integrating it into the new residential enclaves."
          - paragraph [ref=e101]: Other amenities under study could include recreational spaces, sports facilities and retail options, that will bring convenience to users and support the influx of homes in the area. The future developments will be built around the former racecourse grandstand and the current oval shaped open space will be retained for recreational purposes.
          - figure "Artist impression of Turf City MRT station (Source LTA)" [ref=e102]
          - heading "The Future of Homes in Turf City" [level=2] [ref=e105]
          - paragraph [ref=e106]: The area is currently served by Sixth Avenue MRT Station on the Downtown Line (DTL). The upcoming Turf City MRT Station on the Cross Island Line is expected to be completed in 2032. Residents will be within a 10-minute walk from either MRT station, supplemented by buses. Additionally, Bukit Timah Turf City is planned to be car-lite, and pedestrian-friendly neighbourhood that is well-served by public transport. A new bus interchange may also be added, increasing connectivity between Bukit Timah Turf City to other existing amenities in the neighbourhood, as well as other parts of the island.
          - 'figure "Source: URA" [ref=e107]'
          - paragraph [ref=e110]: Road improvement works will also be carried out along Dunearn Road, Bukit Timah Road and Eng Neo Avenue to accommodate an anticipated increase in traffic to and from future developments at Bukit Timah Turf City. Concurrently, a study is being conducted on the technical feasibility and impact of implementing a new exit ramp from the Pan Island Expressway (PIE) towards Tuas.
          - figure [ref=e111]:
            - strong [ref=e114]: "Map of primary schools within 2km of Bukit Timah Turf City (Source: OneMap)"
          - paragraph [ref=e115]: Parents with school-going children will also be eyeing future properties in Bukit Timah Turf City in hopes of securing a placement in one of the numerous popular schools in the vicinity.
          - paragraph [ref=e116]:
            - strong [ref=e117]: "Table 1: List of schools within 2km of Bukit Timah Turf City"
          - 'figure "Source: OneMap" [ref=e118]'
          - paragraph [ref=e121]: Beyond lifestyle and connectivity, the median resale prices in Bukit Timah has increased steadily, which highlights sustained demand in the area.
          - paragraph [ref=e122]:
            - strong [ref=e123]: "Chart 1: Chart 1: Median non-landed residential resale prices in Bukit Timah Planning Area vs CCR (2021 to 2025)"
          - 'figure "Source: URA as at 7 July 2026, ERA Research and Market Intelligence" [ref=e124]'
          - paragraph [ref=e127]: Bukit Timah planning area is largely dominated by landed and freehold homes. There is a limited stock of 99-year leasehold homes in the area, with only around 3,402 units launched since 2010. Furthermore, the last 99-year leasehold projects launched were in 2018, signifying a prolonged period of no new leasehold homes in Bukit Timah.
          - paragraph [ref=e128]: Despite this, from 2021 to 2025, median resale prices in Bukit Timah planning area rose by 38.5% from $1,419 psf to $1,966 psf. This pace of growth is faster than the growth in the CCR region at 16.3%. This suggests that the resale market in Bukit Timah has remained resilient compared to its broader regional counterpart, reflecting underlying demand for 99-year leasehold homes and reinforcing Bukit Timah’s appeal as a prime residential neighbourhood.
          - heading "What Can We Expect with the Upcoming Estate" [level=2] [ref=e129]
          - paragraph [ref=e130]: Today, Bukit Timah is slated for a big transformation, with the upcoming Bukit Timah Turf City expected to yield 15,000 to 20,000 residential homes, both private and public. Through integrating public and private housing, this will foster inclusivity among people of different financial background.
          - paragraph [ref=e131]: According to URA, Bukit Timah Turf City is envisioned to become a high-density yet thoughtfully planned housing estate, with future homes sensitively integrated with heritage elements, lush greenery and public spaces.
          - paragraph [ref=e132]: To push this transformation forward and grow the housing supply, URA has released two Dunearn Road GLS sites, both of which have since closed and been awarded.
          - paragraph [ref=e133]:
            - strong [ref=e134]: "Table 2: List of projects/ GLS sites in Bukit Timah Turf City"
          - 'figure "Source: URA" [ref=e135]'
          - 'figure "Dunearn House (Source: ERApro, Frasers Property, CSC Land Group and Sekisui House)" [ref=e138]'
          - paragraph [ref=e141]: Developed on the first Dunearn Road GLS site, Dunearn House will be the first private condominium to be sold in the emerging Bukit Timah Turf City precinct. It will be within a 4-minute walk to Sixth Avenue MRT Station and a 7-minute walk to the upcoming Turf City MRT Station which is slated for completion in 2032. The private condominium is expected to be launched this month.
          - 'figure "Source: URA Space" [ref=e142]'
          - paragraph [ref=e145]: Located beside Dunearn House, the second Dunearn Road GLS site was released under the 2H 2025 GLS Programme and awarded on 4 May 2026. The site can yield up to 1,400 sqm of commercial space and 335 residential units, adding more retail options and amenities for future residents.
          - paragraph [ref=e146]: The strong participation and competitive bidding for these GLS sites highlight developers’ confidence in the underlying housing demand in Bukit Timah. Dunearn House will be the first 99-year leasehold private condominium launch in the area since Fourth Avenue Residences in 2018. This could lead to some pent-up demand from buyers who are waiting to buy a property in the area.
          - paragraph [ref=e147]: Besides, the projects could appeal to HDB upgraders from nearby mature towns such as Queenstown and Bukit Merah. With a sizeable amount of 888 million-dollar HDB resale transactions recorded from 2021 to 2025 in these estates, households may have accumulated sufficient housing equity to upgrade to a private property in this area. This provides a rare opportunity for HDB upgraders to move into a prime estate like Bukit Timah.
          - heading "In Closing" [level=2] [ref=e148]
          - paragraph [ref=e149]: With more developments in the pipeline, both current and new residents can look forward to the improved convenience, from the new amenities and public transport links that could connect to the rest of the island via public transport links.
          - paragraph [ref=e150]: For buyers, the appeal lies in entering the precinct at an early stage. Beyond convenience, the redevelopment of the former Singapore Turf Club marks a new chapter for Bukit Timah Turf City. What was once a vast racecourse is set to become a residential precinct, shaped by its history, greenery and reputation as a prime residential address in the CCR.
          - paragraph [ref=e151]: So, would you consider making Bukit Timah Turf City your next home?
